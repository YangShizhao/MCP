# DeepSeek Harness (dsh) — MCP 配置片段
#
# 用法：把下面的 - insert: 整段追加到 $DSH_HOME/cordis.patch.yml
#       （Windows 默认 %USERPROFILE%\.dsh\cordis.patch.yml；Linux/Mac 默认 ~/.dsh/cordis.patch.yml）
#       该文件是 dsh 的 YAML 加载器补丁层，对所有 profile 生效。
#       若文件里只有默认的空根占位符「[]」，先删除该行再粘贴。
#       重启 dsh 后工具将以 mcp__<serverName>__<tool> 的名称出现。
#
# 离线安装包（install.sh / install.ps1）会自动写入该配置，并改用
# bin/excelmcp.cmd（Windows）或 bin/excelmcp.sh（Linux/Mac）启动器。
- insert:
    - id: mcp-excel
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: excel
        transport: stdio
        command: python
        args:
          - '-m'
          - excelmcp.server
        env:
          EXCEL_ALLOWLIST_ROOTS: '/home'
          EXCEL_ENABLE_WRITE: 'true'
        # Excel 电子表格处理 — 65 个工具覆盖公式、图表、数据透视表
